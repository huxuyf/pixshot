[package]
name = "pixshot"
version = "1.0.0"
edition = "2021"
description = "PixPin 风格的 Windows 桌面工具：框选截图 / 贴图置顶 / OCR 文字识别（Rust + Win32 + 本地 ONNX 推理）"

[dependencies]
# OCR 本地推理：ort 绑定 onnxruntime；load-dynamic 在运行时加载 onnxruntime.dll
# （优先 <exe目录>/onnxruntime.dll，开发期回退仓库 vendor/onnxruntime/）
#
# 版本必须精确固定：ort 在 load-dynamic 时按编译期 MINOR_VERSION 校验运行时次版本，
# rc.11 对标 ONNX Runtime 1.23，与本仓库随包的 onnxruntime.dll(1.23.0) 一致；换成别版会被拒。
# 关掉默认特性（默认会启用 download-binaries/copy-dylibs/tls-native，并拉入 ureq），只保留 load-dynamic。
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic"] }
# 与本仓库 screen_recorder 工程相同的 Windows API 绑定（Win32 GUI + WinRT OCR）
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # 工具条图标用 GDI+ 抗锯齿描边（纯 GDI 画斜线/圆弧会有锯齿）
    "Win32_Graphics_GdiPlus",
    "Win32_Graphics_Imaging",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Ole",
    # IME 阻断（性能：本应用无文本输入，线程级禁用 IME 防止输入法 DLL 注入）
    "Win32_UI_Input_Ime",
    "Win32_System_Threading",
    # Fluent 视觉（theme.rs）：DWM 圆角/描边/Mica、深色滚动条、注册表读主题
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    # RichEdit 控件（富文本贴图：EM_FORMATRANGE 离屏渲染 RTF）
    "Win32_UI_Controls_RichEdit",
    "Win32_System_Registry",
    # 单实例互斥体（CreateMutexW 依赖 SECURITY_ATTRIBUTES）
    "Win32_Security",
    # RTF 降级文本的代码页解码（MultiByteToWideChar，ANSICPG -> Unicode）
    "Win32_Globalization",
] }

[features]
default = []
# 系统 WinRT OCR 回退（Windows.Media.Ocr，见 src/ocr/winrt.rs）。
#
# 关闭（默认）时进程**不导入** WinRT 运行库（windows.storage.dll / CoreUIComponents.dll /
# CRYPT32.dll / WINHTTP.dll 等，实测常驻十几 MB）——ONNX 引擎才是一直在用的那条路径，
# WinRT 只是「模型缺失」时的兜底。开启后恢复该回退：
#   cargo build --release --features winrt-ocr
# 下面用 `windows/<feature>` 按需打开依赖的 windows crate 特性（等价于原先把它们直接
# 写在依赖 features 里，只是改为由本 feature 控制）。
winrt-ocr = [
    "windows/Foundation",
    "windows/Foundation_Collections",
    "windows/Globalization",
    "windows/Graphics_Imaging",
    "windows/Media_Ocr",
    "windows/Security_Cryptography",
    "windows/Storage_Streams",
]

[profile.release]
opt-level = 2
