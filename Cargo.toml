[package]
name = "pixshot"
version = "0.1.0"
edition = "2021"
description = "PixPin 风格的 Windows 桌面工具：框选截图 / 贴图置顶 / OCR 文字识别（Rust + Win32 + Windows.Media.Ocr）"

[dependencies]
# 与本仓库 screen_recorder 工程相同的 Windows API 绑定（Win32 GUI + WinRT OCR）
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # 工具条图标用 GDI+ 抗锯齿描边（纯 GDI 画斜线/圆弧会有锯齿）
    "Win32_Graphics_GdiPlus",
    "Win32_Graphics_Imaging",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Ole",
    # IME 阻断（性能：本应用无文本输入，线程级禁用 IME 防止输入法 DLL 注入）
    "Win32_UI_Input_Ime",
    "Win32_System_Threading",
    # Fluent 视觉（theme.rs）：DWM 圆角/描边/Mica、深色滚动条、注册表读主题
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_System_Registry",
    # 单实例互斥体（CreateMutexW 依赖 SECURITY_ATTRIBUTES）
    "Win32_Security",
    # WinRT（OCR 用）
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
] }

[profile.release]
opt-level = 2
